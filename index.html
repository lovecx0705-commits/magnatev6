<body><main>
  <section id="cover" class="screen cover"><div id="coverPhoto" class="cover-photo"></div><div><div class="eyebrow">庆《大生意人》开播一周年</div><h1>陈晓|古平原<small>台词入耳 · 人情入心 · 洞察入局</small></h1><p class="motto serif">从宁古塔出发，再陪古平原走一遍。<br>那些台词、那些人、那些局，你还记得吗？</p><p class="cover-copy">35道题库 · 每局随机15题 · 含全剧剧透<br>五卷顺序不变，重玩会遇见新的回忆。</p><button id="start" class="primary">从宁古塔出发</button></div></section>
  <section id="chapter" class="screen chapter-cover" hidden><article class="panel"><img id="chapterImage" class="chapter-image" alt="" hidden><div id="chapterStamp" class="stamp"></div><div id="chapterKicker" class="chapter-kicker"></div><h2 id="chapterTitle"></h2><p id="chapterCopy"></p><button id="enterChapter" class="primary">进入本卷</button></article></section>
  <section id="game" class="screen" hidden><div class="topbar"><div class="progress-row"><strong id="location"></strong><div class="track"><i id="progressBar"></i></div><span id="scorePill" class="score-pill"></span></div><div id="route" class="route"></div></div><article class="panel"><div id="mode" class="mode"></div><h2 id="questionTitle" tabindex="-1"></h2><div id="questionBody"></div><div id="interaction"></div><div id="feedback" class="feedback" hidden></div><div class="actions"><button id="submit" class="primary" hidden>落定</button><button id="next" class="primary" hidden>继续前行</button></div></article></section>
  <section id="chapterEnd" class="screen chapter-cover" hidden><article class="panel chapter-end"><div class="eyebrow">大生意人古平原</div><h2 id="endTitle"></h2><p id="endCopy"></p><div id="seals" class="seal-row"></div><button id="continueRoute" class="primary">前往下一程</button></article></section>
  <section id="result" class="screen result" hidden><article class="panel result-card"><div class="eyebrow">你又陪古平原走了一遍</div><div id="total" class="total"></div><h2 id="rank" class="rank"></h2><p id="resultCopy" class="prompt"></p><div id="stats" class="stats"></div><div class="portrait"><b>你的追剧画像</b><p id="portraitCopy"></p></div>
    <section class="share-builder"><div class="eyebrow">分享给你的小伙伴吧</div><h3>写下你的独家追剧记忆</h3><p class="mini">可以选用以下图片，也可以上传自己的美图</p>
      <div class="field"><label>选择一张分享图</label><div id="shareGallery" class="preset-gallery"></div><div id="imageStatus" class="image-status">尚未选择图片</div></div>
      <label class="upload-label">或者上传自己的图片<input id="shareImageInput" type="file" accept="image/*"></label>
      <div class="field"><label for="reflection">我的观剧感想</label><textarea id="reflection" maxlength="72">再陪古平原走一遍，才发现那些没有说出口的人情，比输赢更难忘。</textarea><div id="count" class="char-count">31 / 72</div></div>
      <div class="field"><label for="relation">最难忘的人物关系</label><select id="relation">
        <optgroup label="至亲与家人">
          <option>古平原 × 常玉儿</option>
          <option>古平原 × 李钦</option>
          <option>古平原 × 李万堂</option>
          <option>古平原 × 母亲</option>
          <option>古平原 × 常四爷</option>
        </optgroup>
        <optgroup label="旧情与故人">
          <option>古平原 × 白依梅</option>
          <option>古平原 × 白先生</option>
          <option>古平原 × 李成</option>
        </optgroup>
        <optgroup label="同行、知己与对手">
          <option>古平原 × 苏紫轩</option>
          <option>古平原 × 王天贵</option>
          <option>古平原 × 晋大奶奶</option>
        </optgroup>
        <optgroup label="宁古塔旧事">
          <option>古平原 × 苏叔河</option>
          <option>古平原 × 苏小虎</option>
          <option>古平原 × 徐管带</option>
          <option>古平原 × 刘老四</option>
        </optgroup>
        <optgroup label="天下商局">
          <option>古平原 × 九帅</option>
          <option>古平原 × 瑞麟</option>
          <option>古平原 × 理查德</option>
        </optgroup>
        <option value="__custom__">其他：自己填写</option>
      </select><input id="customRelation" maxlength="24" placeholder="例如：古平原 × 我最难忘的人物" aria-label="自行填写最难忘的人物关系" hidden><small id="customRelationHint" hidden>填写你想放进分享海报的人物关系</small></div>
      <div class="field"><label for="signature">分享署名</label><input id="signature" maxlength="16" placeholder="例如：晓米团的小伙伴"></div>
      <div class="field"><label for="focus">照片焦点位置</label><input id="focus" type="range" min="0" max="100" value="38"></div>
      <div class="field"><label>海报底色</label><div class="theme-row"><button class="theme-dot theme-green active" data-theme="green" aria-label="墨绿"></button><button class="theme-dot theme-red" data-theme="red" aria-label="朱红"></button><button class="theme-dot theme-blue" data-theme="blue" aria-label="靛青"></button></div></div>
      <button id="makePoster" class="primary">生成我的分享图</button><div class="share-canvas-wrap"><canvas id="poster" width="1080" height="1440"></canvas><img id="posterImage" alt="我的古平原三局成绩分享图"></div><p class="poster-help">微博内可长按上方图片保存；如果长按无反应，再点击“下载分享图”。</p>
      <div class="button-row"><button id="sharePoster" class="ghost">保存说明</button><button id="downloadPoster" class="ghost">下载分享图</button></div>
    </section>
    <div class="actions"><button id="again" class="primary">再走一遍</button></div><details><summary>查看全部15道题与解析</summary><div id="review"></div></details></article></section>
</main>

 {c:0,kind:"势",type:"single",title:"古平原为何接下苏小虎",prompt:"冰河止斗时，他答应将来带苏小虎回中原。哪一种解释最能贯穿他之后的选择？",options:["用一个长期承诺换取眼前停战","替苏叔河偿还刘老四造成的伤害","不让孩子继续承担上一代人的选择与仇恨","借照顾苏小虎证明自己仍是重诺之人"],answer:2,explain:"其余三项都能解释部分行为，但只有第三项触及他的底线：不能让成人的错误继续吞掉孩子的人生。",memory:"古平原第一次让人记住的，不只是会破局，还有答应之后就肯承担。"},
 {c:1,kind:"言",type:"single",title:"读书人的下一条路",quote:"但谁说商人，就不如读书人？",prompt:"这句话在当时最重要的变化是什么？",options:["他用经商否定了此前相信的读书道路","他决定先借商人身份躲避流犯追查","他在功名之外重新寻找能安放价值与能力的道路","他把经商当成查清科场冤案的唯一手段"],answer:2,explain:"经商当然也能帮助他生存和查案，但这句话更深的变化，是他开始重写自己对‘有用之人’的理解。",memory:"从这里开始，回家的路也逐渐变成了古平原认识自己的路。"},
 {c:1,kind:"情",type:"multi",title:"东家不一定是自己人",prompt:"古平原替王天贵做事时，哪些判断能够同时成立？选择三项。",options:["王天贵的知遇确实给了古平原进入商场的位置","古平原既学习王天贵，也在判断他的商道边界","营救常四使这段雇佣关系从一开始就不纯粹","王天贵把古平原当作接班人，因此容忍所有异议","两人目标一致，只是做事手段略有不同"],answers:[0,1,2],explain:"知遇、学习与隐秘目的同时存在。古平原不是假意做事，但也从未把自己的原则交给东家。",memory:"人情局里最难看懂的，往往不是敌友，而是暂时站在同一边的人。"},
 {c:1,kind:"势",type:"single",title:"第一次判断：李万堂为何留手",prompt:"此时你还不知道后来的身世。李万堂打压古平原，却没有每次都赶尽杀绝。你最相信哪一种解释？",options:["欣赏人才，想留为己用","想把古平原留给李钦练手","对古平原有无法言明的复杂情感","只是暂时腾不出手"],answer:null,oldcase:true,explain:"这一题暂不判对错。你的判断会被封存，等走到江南，再回来重审。",memory:"有些答案，必须等真相出现以后，才能重新读懂。"},
 {c:2,kind:"情",type:"multi",title:"白依梅不只是一段旧情",prompt:"古平原坚持保护白依梅，哪些解释最有连续的剧情证据？选择三项。",options:["未完成的婚约仍构成道义责任","对白先生的承诺使他无法置身事外","感情、亏欠与物是人非同时存在","他借保护白依梅延续对李成的控制","他需要证明自己对常玉儿没有动心"],answers:[0,1,2],explain:"爱情、责任、承诺和亏欠彼此交叠。后两项能制造戏剧冲突，却缺少古平原主动行为的持续支持。",memory:"有些关系结束于不爱，有些却结束于再也回不到原来的身份。"},
 {c:2,kind:"势",type:"single",title:"常玉儿的退后",prompt:"明知古平原身有婚约，常玉儿仍助他回乡。哪一种解释最接近她一贯的选择逻辑？",options:["她相信共同患难最终会胜过旧日婚约","她把不索取当成维护自尊的方式","她把古平原能否平安完成心愿放在自己的结果之前","她暂时退出，是为了让古平原亲自比较两段感情"],answer:2,explain:"自尊与期待都可能存在，但贯穿她行动的是尊重：不把恩情变成要求，也不替古平原决定。",memory:"追剧时让人心动的，不只是相守，还有明知舍不得，仍愿意成全。"},
 {c:2,kind:"情",type:"single",title:"猎人和猎物",prompt:"苏紫轩与古平原的关系中，哪一种判断最完整？",options:["苏紫轩掌握资源，所以始终拥有关系主导权","古平原总能改变结果，所以实际一直在反利用苏紫轩","两人交换主导权，也在原则冲突中确认彼此不可控制","两人的互相托底说明他们最终成为了真正同道"],answer:2,explain:"资源不等于绝对主导，能够互相托底也不等于同路。他们最特别之处，正是需要、欣赏与戒备长期共存。",memory:"能够彼此托底，不等于会走同一条路。"},
 {c:3,kind:"情",type:"single",title:"李钦想战胜的是谁",prompt:"盐业竞争中，李钦越来越执着于击败古平原。哪一种动机最能解释他后来不断加码？",options:["维护李家利益，避免古平原改变盐业格局","证明自己不是父亲阴影下、需要被保护的少东家","惩罚古平原在友情与商业之间选择了后者","迫使古平原重新承认两人仍是平等的朋友"],answer:1,explain:"其他动机都可能参与，但不断加码的核心来自自我证明：古平原越值得欣赏，李钦就越无法接受自己输给他。",memory:"最复杂的敌意，往往生长在真正的欣赏之后。"},
 {c:3,kind:"势",type:"multi",title:"旧案重审：李万堂为何留手",prompt:"身世揭晓后，请重新解释李万堂早先的行为。选择你认为同时成立的三层动机。",options:["对亲生儿子的本能保护","对抛妻弃子的愧疚","害怕秘密暴露并试图控制局面","单纯欣赏古平原的生意才能","毫无目的，只是优柔寡断"],answers:[0,1,2],revisit:true,explain:"父爱不是唯一答案。保护、愧疚、恐惧和控制交织在一起，才让他的每一次“留手”都如此矛盾。",memory:"真相没有推翻从前的故事，而是让每个旧细节显出另一层颜色。"},
 {c:3,kind:"势",type:"order",title:"一段关系，五次改名",prompt:"按剧情顺序，排列古平原与李钦关系的变化。",options:["同父异母的兄弟","互相试探的陌生人","彼此欣赏的朋友","必须分出胜负的对手","真相后的怨恨与对立"],order:[1,2,3,0,4],explain:"血缘出现得最晚，却没有自动修复此前的竞争；成为兄弟只需一句真相，学会做兄弟却可能需要一生。",memory:"他们最令人难忘之处，正是每一个关系名称都不足以概括全部。"},
 {c:4,kind:"言",type:"single",title:"比成交更重要的东西",quote:"这天底下有比钱更重要的东西。",prompt:"紧接这句话，古平原给出的原话是什么？",options:["公道","人命","信誉","良心"],answer:1,explain:"四项都属于他的商道，但当时他只落下两个字：人命。从宁古塔到终局，这两个字也一次次成为他的选择底线。",memory:"古平原的商道并非不谈利益，而是不让利益成为唯一尺度。"},
 {c:4,kind:"情",type:"multi",title:"最终站在他身边的人",prompt:"终局中，下列哪些关系不能只用“盟友”概括？选择四项。",options:["常玉儿：相守也是共同承担","李钦：对立中仍有未尽的兄弟情","苏紫轩：相互利用也相互成全","李万堂：伤害之外仍有无法割断的血缘","洋商：彼此欣赏所以并肩合作"],answers:[0,1,2,3],explain:"复杂人物关系的意义，在于立场与感情并不总是同向。对立不抹去旧情，合作也不等于同路。",memory:"走到最后，古平原身边没有简单的关系，只有一起经历过的选择。"},
 {c:4,kind:"势",type:"single",title:"古平原真正完成的破局",prompt:"从流犯到大生意人，哪一种变化最接近全剧对他的塑造？",options:["他用商业成功重新证明读书人的价值","他从寻找个人生路，走向为更多人争取选择的余地","他学会用比对手更强的权力保护自己的商道","他最终接受情义必须让位于更大的商业秩序"],answer:1,explain:"成功、权力与秩序都是过程，不是终点。他的核心没有被商场改写，而是在经历中扩大成对更多人的责任。",memory:"我们重走的不是一条发财路，而是一个人如何在经历中认出自己。"},
 {c:0,kind:"言",type:"single",title:"天底下没有不还的债",quote:"这天底下没有不还的债。",prompt:"古平原说这句话时，最直接针对的是什么？",options:["李钦管家连夜离城","刘老四为送走儿子坑害苏叔河","徐管带勒索流犯","苏小虎执意替父报仇"],answer:1,explain:"他追问的并非一笔银钱，而是刘老四用兄弟性命换取儿子出路之后，必须面对的代价。",memory:"宁古塔的债，常常不是银债，而是人命与情义。"},
 {c:0,kind:"势",type:"single",title:"为什么不跟苏紫轩走",prompt:"逃出宁古塔后，古平原为什么没有直接跟苏紫轩走上她的道路？",options:["他不相信苏紫轩能保护苏家母子","他仍想查清冤案，也不愿让家人背上反贼之名","他认为苏紫轩没有足够的生意资源","他已经答应常四加入马帮"],answer:1,explain:"他感激苏紫轩，却不愿让别人替自己定义道路。查清冤案、回家与不连累家人，仍是他当时最深的牵挂。",memory:"接受帮助不等于交出选择，这也是古平原与苏紫轩关系的底色。"},
 {c:0,kind:"情",type:"single",title:"常四为何冒险救他",prompt:"常四明知救流犯可能牵连整个马帮，仍把古平原带走。哪一种关系判断最准确？",options:["只因古平原答应替他拿到盐引","既有报答，也认可古平原此前救人的担当","主要是常玉儿坚持，常四并不认同","他想利用古平原对付王天贵"],answer:1,explain:"盐引与玉儿的坚持都在其中，但真正让常四承担风险的，是他相信这个人值得救。",memory:"有些过命之交，开始于看见对方怎样对待别人的命。"},
 {c:0,kind:"情",type:"single",title:"苏紫轩最早看中了什么",prompt:"苏紫轩最初评价古平原“是个聪明人”。她真正看中的只是聪明吗？",options:["是，她只需要一个会算账的人","不，她看中的是聪明、胆量和在绝境中仍能行动","不，她主要看中古平原的流犯身份便于控制","是，但她误以为古平原会完全服从"],answer:1,explain:"聪明只是表面。古平原能看穿局、敢承担后果，又没有现成归属，才使他成为苏紫轩想争取的人。",memory:"她最早看见了他的价值，也最早想把这份价值放进自己的棋局。"},
 {c:1,kind:"言",type:"single",title:"商道四句话",quote:"以信为本，以义为根，以流通为手段，以方便为路径。",prompt:"古平原用这套商道反驳的是谁的做法？",options:["王天贵以东家身份压制掌柜","李万堂依靠强权与资本挤压山西票号","老八家拒绝接纳外来商人","李钦用新式银号挑战旧规矩"],answer:1,explain:"他反对的不是竞争，而是以势压人、破坏信用与流通根基的做法。",memory:"古平原与李万堂真正的分野，从来不只是输赢，而是怎样赢。"},
 {c:1,kind:"情",type:"single",title:"牢门外的常玉儿",prompt:"常玉儿希望古平原洗清嫌疑、回乡迎娶白依梅。这最能说明什么？",options:["她认为婚约比自己的感情更重要","她还没有意识到自己喜欢古平原","她愿意尊重古平原原有的人生，而不是把救命之恩变成索取","她相信白依梅已经不会等他"],answer:2,explain:"这不是否定自己，而是不替古平原决定。她的爱始终带着江湖儿女的坦荡和边界。",memory:"她最让人喜欢的地方，是深情却不拧巴。"},
 {c:1,kind:"势",type:"single",title:"没有现银，如何成局",prompt:"古平原帮助老八家对抗李万堂时，真正调动的资源是什么？",options:["闯王宝藏的传闻","票号之间的信用与彼此承兑","王爷对李万堂的不满","王天贵暗藏的现银"],answer:1,explain:"他把分散的信用连成一张网，让‘没有现银’不等于‘没有支付能力’。",memory:"这一次破局，让读书人的逻辑真正进入了商场。"},
 {c:1,kind:"情",type:"multi",title:"李钦为何帮古平原",prompt:"面对父亲的阻拦，李钦仍多次帮助古平原。哪些动机有连续依据？选择三项。",options:["真心欣赏古平原","借帮助古平原反抗父亲控制","希望证明自己有独立判断","提前为争夺李家家产布局","想让苏紫轩放弃古平原"],answers:[0,1,2],explain:"友情、反叛与自我证明同时存在。也正因此，他的帮助从来不是单纯站队。",memory:"李钦越想成为自己，越无法摆脱父亲与古平原共同构成的镜子。"},
 {c:2,kind:"言",type:"single",title:"值不值，谁说了算",quote:"值不值你说了不算，我觉得才算。",prompt:"这句话最能体现古平原面对李成时的哪一种态度？",options:["拒绝让李成定义他的牺牲与选择","以恩人身份要求李成服从","证明自己比李成更懂人命成本","用挑衅逼李成放走白依梅"],answer:0,explain:"他承认自己承担代价，也坚持代价由自己判断；这是救人，也是夺回选择权。",memory:"古平原与李成的交锋，常常不是谁更强，而是谁有权决定怎样活。"},
 {c:2,kind:"情",type:"single",title:"为什么连李成也要救",prompt:"古平原后来坚持让白依梅和李成都活下来，最完整的解释是什么？",options:["只有李成活着，白依梅才不会恨他","他既履行对白先生的承诺，也不愿用李成的死替自己解决感情难题","他希望李成带旧部投靠自己","苏紫轩要求他必须同时救两人"],answer:1,explain:"救白依梅而放任李成死去，看似成全承诺，实则会把新的伤害留给白依梅。",memory:"真正的保护，不是替一个人拿走她所选择的关系。"},
 {c:2,kind:"势",type:"single",title:"退还聘帖意味着什么",prompt:"白依梅退还聘帖，最接近哪一种关系转折？",options:["她已经彻底不爱古平原","她拒绝再让旧约替当下的自己作决定","她以此逼古平原立即带她离开","她认为古平原已经选择常玉儿"],answer:1,explain:"感情未必消失，但她不再只是等待旧约兑现的人。退帖是结束名分，也是重新取得选择。",memory:"错过之所以意难平，正因为它不是一句‘不爱了’可以解释。"},
 {c:2,kind:"情",type:"multi",title:"四个人完成一场营救",prompt:"营救李成旧部时，哪些人物作用判断成立？选择三项。",options:["白依梅提出请求，使旧部的命运进入古平原视野","苏紫轩准备退路与船只","常玉儿推动古平原不要见死不救","李钦负责说服九帅","李万堂替众人承担官府压力"],answers:[0,1,2],explain:"发起、资源与情感推动来自不同人物。复杂关系不是谁帮助了古平原，而是每个人都改变了别人的选择。",memory:"这场营救没有唯一主角，却让几段关系短暂地站到同一方向。"},
 {c:3,kind:"言",type:"single",title:"君子协定为何必要",prompt:"古平原与李钦以言为约，除了公平竞争，还在保护什么？",options:["保护两人的私人关系，不让李万堂直接介入","保护盐业价格不被任何一方操控","保护苏紫轩在两方之间的中立","保护古母不再知道李家的事"],answer:0,explain:"约定既是规则，也是两人试图为友情留下的边界。可后来证明，语言可以约束手段，却未必压得住证明欲。",memory:"他们都想做对手，又都不愿承认这场竞争会伤到朋友。"},
 {c:3,kind:"情",type:"single",title:"古母认出的不只是丈夫",prompt:"古母认出李万堂就是古皖章时，这一幕真正击碎了什么？",options:["古平原对父亲仍活着的幻想","李万堂精心维持的身份、家庭与成功叙事","李钦对古平原商业能力的判断","常玉儿对李家的戒备"],answer:1,explain:"真相不只是认亲，而是让李万堂的富贵建立在何种抛弃与隐瞒之上，再也无法被遮住。",memory:"一个名字被叫出，几个人此前的人生同时被改写。"},
 {c:3,kind:"情",type:"single",title:"李钦为什么更恨古平原",prompt:"身世揭晓后，李钦的敌意反而加深。哪一种解释最完整？",options:["他害怕古平原继承李家产业","古平原让他失去商业对手的乐趣","古平原的存在动摇了他对父亲、身份和自身价值的全部理解","他认定古母故意在众人面前羞辱李家"],answer:2,explain:"财产与羞辱只是表层。古平原成为兄长之后，李钦过去所有比较、欣赏与嫉妒都被迫重新命名。",memory:"血缘没有消除竞争，反而让竞争进入了更深的身份伤口。"},
 {c:3,kind:"情",type:"single",title:"从救命之恩到共同生活",prompt:"古平原与常玉儿成亲，真正完成的关系变化是什么？",options:["古平原终于用婚姻偿还救命之恩","常玉儿终于赢过白依梅","两人从彼此成全，走向共同承担未来的选择","古平原需要常家的商路支持盐业"],answer:2,explain:"这段婚姻不是报恩，也不是感情竞赛，而是两个人经过分别与选择后主动走向彼此。",memory:"最好的相守，不是终于得到，而是终于决定一起承担。"},
 {c:4,kind:"势",type:"single",title:"李钦抵押给洋人的代价",prompt:"李钦为了继续竞争而向洋人抵押产业，最深的悲剧是什么？",options:["他低估了洋人的资金实力","证明自己的欲望开始吞掉他原本想守住的商人身份与底线","他没有提前征得李家董事同意","古平原因此不再承认两人的血缘"],answer:1,explain:"他起初想证明自己能够独立成为一个商人，最后却为了证明而交出了商人的主动权。",memory:"有些失败不是输掉生意，而是赢的方式已经背叛最初的自己。"},

function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function randomizeOptions(q){const copy=Object.assign({},q),perm=shuffle(q.options.map((_,i)=>i));copy.options=perm.map(i=>q.options[i]);if(q.answer!==undefined&&q.answer!==null)copy.answer=perm.indexOf(q.answer);if(q.answers)copy.answers=q.answers.map(i=>perm.indexOf(i));if(q.order)copy.order=q.order.map(i=>perm.indexOf(i));return copy}
function buildRun(){const chosen=[],pattern=[["言","情","势"],["言","情"],["言","情","势"],["言","情"],["言","情","势"]];for(let c=0;c<5;c++){const picked=pattern[c].map(kind=>shuffle(bank.filter(q=>q.c===c&&q.kind===kind&&!q.oldcase&&!q.revisit))[0]);if(c===1)picked.push(bank.find(q=>q.oldcase));if(c===3)picked.push(bank.find(q=>q.revisit));picked.sort((a,b)=>bank.indexOf(a)-bank.indexOf(b));chosen.push(...picked)}return chosen.map(randomizeOptions)}
let questions=buildRun();
const state={i:0,chapter:0,total:0,scores:{言:0,情:0,势:0},max:{言:0,情:0,势:0},answers:[],oldAnswer:null,selected:[],picked:[],photo:null,photoSource:"",theme:"green",resultPct:0,resultRank:""};

const $=id=>document.getElementById(id),screens=["cover","chapter","game","chapterEnd","result"];

function applyConfiguredImages(){if(IMAGE_CONFIG.cover)$("coverPhoto").style.backgroundImage=imageUrl(IMAGE_CONFIG.cover);const img=$("chapterImage"),src=IMAGE_CONFIG.chapterImages[state.chapter]||"";img.onerror=()=>{img.hidden=true};if(src){img.src=src;img.alt=`${chapters[state.chapter].name}篇章图片`;img.hidden=false}else{img.removeAttribute("src");img.alt="";img.hidden=true}}
function show(id){applyConfiguredImages();screens.forEach(x=>$(x).hidden=x!==id);try{window.scrollTo({top:0,behavior:"smooth"})}catch(e){window.scrollTo(0,0)}}
function renderRoute(){$("route").innerHTML=chapters.map((c,i)=>`<div class="route-step ${i<state.chapter?'done':i===state.chapter?'active':''}"><i>${c.stamp}</i><span>${c.name}</span></div>`).join("")}
function openChapter(){const c=chapters[state.chapter];$("chapterStamp").textContent=c.stamp;$("chapterKicker").textContent=`第${["一","二","三","四","五"][state.chapter]}卷 · ${c.name}`;$("chapterTitle").textContent=c.title;$("chapterCopy").textContent=c.copy;show("chapter")}
function button(text,idx){return `<button class="choice" data-i="${idx}">${text}</button>`}
function renderQuestion(){const q=questions[state.i];state.selected=[];state.picked=[];show("game");renderRoute();$("location").textContent=q.c===4?"最后一程":chapters[q.c].name;$("progressBar").style.width=`${state.i/questions.length*100}%`;$("scorePill").textContent=`${state.i+1} / ${questions.length}`;$("mode").textContent=q.kind==="言"?"台词局 · 听其言":q.kind==="情"?"人情局 · 识其心":"洞察局 · 破其势";$("questionTitle").textContent=q.title;let body=q.quote?`<blockquote class="quote">${q.quote}</blockquote>`:"";body+=`<p class="prompt">${q.prompt}</p>`;if(q.revisit&&state.oldAnswer!==null){const oldQ=questions.find(x=>x.oldcase);body+=`<div class="old-answer"><small>你在山西卷的判断</small>${oldQ.options[state.oldAnswer]}</div>`}$("questionBody").innerHTML=body;$("feedback").hidden=true;$("submit").hidden=true;$("next").hidden=true;if(q.type==="single")$("interaction").innerHTML=`<div class="choices">${q.options.map(button).join("")}</div>`;if(q.type==="multi"){$("interaction").innerHTML=`<div class="mini">可多选</div><div class="choices">${q.options.map(button).join("")}</div>`;$("submit").hidden=false;$("submit").disabled=true}if(q.type==="order"){$("interaction").innerHTML=`<div class="mini">依次点击；点已选项可撤回</div><div id="picked" class="order-picked"></div><div class="choices">${q.options.map(button).join("")}</div>`;$("submit").hidden=false;$("submit").disabled=true}document.querySelectorAll(".choice").forEach(b=>b.addEventListener("click",()=>choose(+b.dataset.i)));try{$("questionTitle").focus({preventScroll:true})}catch(e){$("questionTitle").focus()}}
function choose(i){const q=questions[state.i];if(q.type==="single"){state.selected=[i];document.querySelectorAll(".choice").forEach((b,n)=>b.classList.toggle("selected",n===i));finish()}else if(q.type==="multi"){state.selected.includes(i)?state.selected=state.selected.filter(x=>x!==i):state.selected.push(i);document.querySelectorAll(".choice").forEach((b,n)=>b.classList.toggle("selected",state.selected.includes(n)));$("submit").disabled=state.selected.length===0}else{if(i>=0){const at=state.picked.indexOf(i);at>=0?state.picked.splice(at,1):state.picked.push(i)}document.querySelectorAll(".choice").forEach((b,n)=>{b.disabled=state.picked.includes(n);b.classList.toggle("selected",state.picked.includes(n))});$("picked").innerHTML=state.picked.map((x,n)=>`<span data-pos="${n}">${n+1}. ${q.options[x]}</span>`).join("");$("picked").querySelectorAll("span").forEach(s=>s.onclick=()=>{state.picked.splice(+s.dataset.pos,1);choose(-1)});$("submit").disabled=state.picked.length!==q.options.length}}
function same(a,b){const x=[...a].sort(),y=[...b].sort();return x.length===y.length&&x.every((v,i)=>v===y[i])}
function finish(){const q=questions[state.i],given=q.type==="order"?[...state.picked]:[...state.selected];let pts=0,ok=false;if(q.oldcase){state.oldAnswer=given[0];ok=true}else if(q.type==="single"){ok=given[0]===q.answer;pts=ok?3:0}else if(q.type==="multi"){const correct=q.answers.filter(x=>given.includes(x)).length,wrong=given.filter(x=>!q.answers.includes(x)).length;pts=Math.max(0,Math.min(3,correct-wrong+1));ok=same(given,q.answers)}else{const correctPos=given.filter((x,i)=>x===q.order[i]).length;pts=Math.round(3*correctPos/q.order.length);ok=correctPos===q.order.length}if(!q.oldcase){state.total+=pts;state.scores[q.kind]+=pts}state.answers.push({given,pts,ok});document.querySelectorAll(".choice").forEach((b,n)=>{b.disabled=true;if(q.type==="single"&&!q.oldcase){if(n===q.answer)b.classList.add("correct");else if(given.includes(n))b.classList.add("wrong")}if(q.type==="multi"&&q.answers.includes(n))b.classList.add("correct")});$("submit").hidden=true;$("feedback").innerHTML=`<h3>${q.oldcase?"判断已封存":ok?"这一层，你看见了":"记忆被重新点亮"}</h3><p>${q.explain}</p>${q.oldcase?"":`<p class="points">本题 ${pts} / 3</p>`}<div class="memory"><b>追剧记忆</b>${q.memory}</div>`;$("feedback").hidden=false;$("next").hidden=false;const nextQuestion=questions[state.i+1];$("next").textContent=state.i===questions.length-1?"查看三局结果":nextQuestion&&nextQuestion.c!==q.c?"完成本卷":"继续前行"}
function next(){const q=questions[state.i],was=q.c;state.i++;if(state.i>=questions.length){state.chapter=4;showChapterEnd();return}if(questions[state.i].c!==was){state.chapter=was;showChapterEnd()}else renderQuestion()}
function showChapterEnd(){const c=chapters[state.chapter];$("endTitle").textContent=`${c.name} · ${c.title}`;$("endCopy").textContent=c.end;$("seals").innerHTML=chapters.slice(0,state.chapter+1).map(x=>`<div class="seal">${x.stamp}</div>`).join("");$("continueRoute").textContent=state.chapter===4?"查看三局结果":"前往下一程";show("chapterEnd")}
function continueRoute(){if(state.chapter===4){renderResult();return}state.chapter++;openChapter()}
function renderResult(){show("result");const max=questions.filter(q=>!q.oldcase).length*3,pct=Math.round(state.total/max*100),rank=pct>=90?"世事洞明":pct>=75?"阅尽人心":pct>=60?"入局有道":"重拾旧忆",top=Object.entries(state.scores).sort((a,b)=>b[1]-a[1])[0][0],topName={言:"台词入耳",情:"人情入心",势:"洞察入局"}[top];state.resultPct=pct;state.resultRank=rank;$("total").textContent=pct;$("rank").textContent=rank;$("resultCopy").textContent=`从宁古塔到天下商局，你点亮了五卷记忆。最强能力：${topName}。`;$("stats").innerHTML=["言","情","势"].map(k=>`<div class="stat"><span>${{言:"台词",情:"人情",势:"洞察"}[k]}</span><strong>${state.scores[k]}/${state.max[k]}</strong></div>`).join("");$("portraitCopy").textContent=top==="言"?"你对人物说过的话格外敏感，一句熟悉的台词，就能带你回到当时的场景。":top==="情"?"你最擅长看见关系中没有说出口的部分：欣赏背后的嫉妒、保护之中的控制，以及成全里的不舍。":"你习惯把人物选择放回整段剧情中理解，不只记得发生了什么，也会追问为什么走到这里。";$("review").innerHTML=questions.map((q,i)=>{const a=state.answers[i],given=a.given.map(x=>q.options[x]).join("、")||"未选择";return `<div class="review-item"><b>${i+1}. ${q.title}</b><p>你的选择：${given}</p><p>${q.explain}</p></div>`}).join("");requestAnimationFrame(drawPoster)}

function loadPhoto(file){return new Promise((resolve,reject)=>{if(!file)return reject();const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{state.photo={img,url:reader.result};resolve(img)};img.onerror=reject;img.src=reader.result};reader.onerror=reject;reader.readAsDataURL(file)})}

function drawImageCover(ctx,img,x,y,w,h,focus){const ir=img.width/img.height,br=w/h;let sw,sh,sx,sy;if(ir>br){sh=img.height;sw=sh*br;sx=(img.width-sw)/2;sy=0}else{sw=img.width;sh=sw/br;sx=0;sy=(img.height-sh)*(focus/100)}ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h)}
function wrapText(ctx,text,x,y,maxWidth,lineHeight,maxLines=4){let line="",lines=[];for(const ch of text){const test=line+ch;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=ch}else line=test}if(line)lines.push(line);lines=lines.slice(0,maxLines);lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lineHeight));return y+lines.length*lineHeight}
function roundRect(ctx,x,y,w,h,r){const radius=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+radius,y);ctx.lineTo(x+w-radius,y);ctx.quadraticCurveTo(x+w,y,x+w,y+radius);ctx.lineTo(x+w,y+h-radius);ctx.quadraticCurveTo(x+w,y+h,x+w-radius,y+h);ctx.lineTo(x+radius,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-radius);ctx.lineTo(x,y+radius);ctx.quadraticCurveTo(x,y,x+radius,y);ctx.closePath()}

function drawPoster(){const c=$("poster"),ctx=c.getContext("2d"),themes={green:["#0d1d16","#31503c","#e3c17b"],red:["#2a1010","#74382f","#edc88a"],blue:["#101a28","#344f70","#dfbd75"]},t=themes[state.theme],focus=+$("focus").value;ctx.clearRect(0,0,c.width,c.height);const bg=ctx.createLinearGradient(0,0,0,1440);bg.addColorStop(0,t[1]);bg.addColorStop(.62,t[0]);bg.addColorStop(1,"#07100c");ctx.fillStyle=bg;ctx.fillRect(0,0,1080,1440);
  if(state.photo){drawImageCover(ctx,state.photo.img,0,0,1080,760,focus);const shade=ctx.createLinearGradient(0,0,0,780);shade.addColorStop(0,"rgba(0,0,0,.08)");shade.addColorStop(.55,"rgba(0,0,0,.16)");shade.addColorStop(1,t[0]);ctx.fillStyle=shade;ctx.fillRect(0,0,1080,800)}else{ctx.fillStyle="rgba(240,210,145,.07)";ctx.font="700 430px serif";ctx.textAlign="right";ctx.fillText("局",1060,455);ctx.strokeStyle="rgba(230,198,128,.18)";ctx.lineWidth=3;for(let i=0;i<5;i++){ctx.beginPath();ctx.arc(780,240,120+i*55,Math.PI*.15,Math.PI*1.5);ctx.stroke()}}
  ctx.textAlign="left";ctx.fillStyle=t[2];ctx.font="28px sans-serif";ctx.fillText("《大生意人》开播一周年",64,74);ctx.font="700 78px serif";ctx.fillStyle="#fff6df";ctx.fillText("古平原",64,165);
  const cardY=state.photo?650:360;roundRect(ctx,52,cardY,976,700,28);ctx.fillStyle="rgba(7,18,13,.86)";ctx.fill();ctx.strokeStyle="rgba(226,192,117,.55)";ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle=t[2];ctx.font="700 142px sans-serif";ctx.fillText(String(state.resultPct),92,cardY+180);ctx.font="700 54px serif";ctx.fillStyle="#fff2d5";ctx.fillText(state.resultRank,390,cardY+150);ctx.font="28px sans-serif";ctx.fillStyle="#cbd3c9";ctx.fillText("台词入耳 · 人情入心 · 洞察入局",390,cardY+202);
  const labels=[["台词",state.scores.言,state.max.言],["人情",state.scores.情,state.max.情],["洞察",state.scores.势,state.max.势]];labels.forEach((a,i)=>{const x=92+i*294;roundRect(ctx,x,cardY+244,260,104,16);ctx.fillStyle="rgba(255,255,255,.06)";ctx.fill();ctx.fillStyle="#b7c2b8";ctx.font="24px sans-serif";ctx.fillText(a[0],x+18,cardY+282);ctx.fillStyle=t[2];ctx.font="700 32px sans-serif";ctx.fillText(`${a[1]} / ${a[2]}`,x+18,cardY+326)});
  ctx.fillStyle=t[2];ctx.font="25px sans-serif";ctx.fillText("我最难忘的关系",92,cardY+407);ctx.fillStyle="#fff5df";ctx.font="700 42px serif";ctx.fillText(relationText(),92,cardY+458);
  ctx.fillStyle="#dccfb5";ctx.font="31px serif";const after=wrapText(ctx,`“${$("reflection").value.trim()||"那些追剧的快乐，我还记得。"}”`,92,cardY+530,870,48,3);ctx.fillStyle="#b9c1b8";ctx.font="23px sans-serif";const sig=$("signature").value.trim();ctx.fillText(sig?`—— ${sig}`:"—— 一位仍记得古爷的观众",92,Math.min(cardY+676,after+28));
  ctx.fillStyle="#ccb77e";ctx.font="22px sans-serif";ctx.textAlign="right";ctx.fillText("再陪古平原走一遍",986,1400);try{$("posterImage").src=c.toDataURL("image/jpeg",.94)}catch(e){$("imageStatus").textContent="分享图生成失败，请换一张图片后重试。"}}
function downloadPoster(){drawPoster();const a=document.createElement("a");a.href=$("posterImage").src;a.download=`古平原三局_${state.resultRank}.jpg`;document.body.appendChild(a);a.click();document.body.removeChild(a)}
